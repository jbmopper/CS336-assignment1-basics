# WandB Sweep Configuration
# This configuration defines a hyperparameter sweep for the transformer language model
# 
# Usage:
#   1. Initialize the sweep:
#      wandb sweep cs336_basics/sweep_config.yaml
#   
#   2. Start sweep agent(s):
#      wandb agent <entity>/<project>/<sweep_id>

program: cs336_basics/train_sweep.py
method: bayes  # Bayesian optimization for efficient hyperparameter search
metric:
  name: Eval Loss
  goal: minimize

parameters:
  # Learning rate parameters (stock model/settings, sweep LR only)
  scheduler_lr_max:
    distribution: uniform
    min: 5e-5
    max: 5e-1

# Early termination to stop poor performing runs
early_terminate:
  type: hyperband
  min_iter: 250
  max_iter: 1000
  eta: 3
  s: 1
