# WandB Sweep Configuration
# This configuration defines a hyperparameter sweep for the transformer language model
# 
# Usage:
#   1. Initialize the sweep:
#      wandb sweep cs336_basics/sweep_config.yaml
#   
#   2. Start sweep agent(s):
#      wandb agent <entity>/<project>/<sweep_id>

program: cs336_basics/train_sweep.py
method: bayes  # Bayesian optimization for efficient hyperparameter search
metric:
  name: eval_loss
  goal: minimize

parameters:
  # Learning rate parameters
  lr_max:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-2
  
  lr_min:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-4

  # Model architecture parameters
  d_model:
    values: [256, 384, 512, 768]
  
  num_heads:
    values: [4, 8, 16]
  
  num_layers:
    values: [2, 4, 6, 8]
  
  d_ff:
    distribution: int_uniform
    min: 512
    max: 2048
  
  # Training parameters
  batch_size:
    values: [16, 32, 64]
  
  context_length:
    values: [128, 256, 512]
  
  warmup_iters:
    distribution: int_uniform
    min: 50
    max: 500

  # Optimizer parameters
  weight_decay:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-1

  gradient_clip:
    distribution: uniform
    min: 0.5
    max: 2.0

# Early termination to stop poor performing runs
early_terminate:
  type: hyperband
  min_iter: 100
  eta: 3
  s: 2
