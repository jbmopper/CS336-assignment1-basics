# Canonical model configurations for experiments
#
# These are the authoritative definitions for Model A and Model B.
# All scripts should load from this file to ensure consistency.

# Model A: "Wide and Shallow"
# Prioritizes attention width with fewer layers
model_a:
  name: "Model_A_wide"
  description: "Wider, shallower model for width/depth tradeoff"
  batch_size: 32
  model_settings:
    vocab_size: 10000
    d_model: 768
    num_heads: 12      # d_head = 64
    num_layers: 2
    d_ff: 2048
    context_length: 256
    rope_theta: 10000.0

# Model B: "Narrow and Deep"
# Prioritizes depth with narrower attention
model_b:
  name: "Model_B_deep"
  description: "Deeper, narrower model for width/depth tradeoff"
  batch_size: 32
  model_settings:
    vocab_size: 10000
    d_model: 384
    num_heads: 12      # d_head = 32
    num_layers: 12
    d_ff: 1024
    context_length: 256
    rope_theta: 10000.0

# Smol versions for smoke testing
smol_model_a:
  name: "Smol_Model_A"
  description: "Tiny version of Model A for smoke testing"
  batch_size: 8
  model_settings:
    vocab_size: 10000
    d_model: 128
    num_heads: 4
    num_layers: 2
    d_ff: 256
    context_length: 64
    rope_theta: 10000.0

smol_model_b:
  name: "Smol_Model_B"
  description: "Tiny version of Model B for smoke testing"
  batch_size: 8
  model_settings:
    vocab_size: 10000
    d_model: 96
    num_heads: 3
    num_layers: 3
    d_ff: 384
    context_length: 64
    rope_theta: 10000.0

# Assignment default model (~17M parameters)
assignment_default:
  name: "Assignment_Default"
  description: "Default model from assignment specification"
  batch_size: 32
  model_settings:
    vocab_size: 10000
    d_model: 512
    num_heads: 16
    num_layers: 4
    d_ff: 1344
    context_length: 256
    rope_theta: 10000.0
